# SoilGood iOS build for Sideloadly with a free Apple ID.
# Codemagic builds an unsigned .ipa. No Apple certificate or provisioning profile.
# Download the .ipa from Artifacts, then let Sideloadly sign and install it.
# Free signing lasts about 7 days; sideload the same .ipa again after that.
#
# Before the first build, in the Codemagic UI:
# 1. Connect this Git repo and choose "codemagic.yaml" as the configuration.
# 2. Environment variable group "soilgood_secrets":
#      SUPABASE_URL
#      SUPABASE_ANON_KEY
#    Use the anon key only. Never put the service_role key here.

workflows:
  ios-sideload:
    name: SoilGood iOS (Sideloadly IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - soilgood_secrets
    scripts:
      - name: Write .env for the Flutter asset bundle
        script: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY. Add them to the soilgood_secrets group."
            exit 1
          fi
          cat > "$CM_BUILD_DIR/.env" <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate iOS project files
        script: flutter build ios --config-only --release --no-codesign
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: Pack unsigned IPA for Sideloadly
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH"
            exit 1
          fi
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          zip -r -y SoilGood-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
